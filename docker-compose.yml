version: '3.8'

services:
  # 1. PostgreSQL Database (Production Cloud Architecture)
  db:
    image: postgres:15-alpine
    container_name: link_x8_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-link_x8_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. FastAPI Backend Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: link_x8_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/link_x8_db
      ENVIRONMENT: production
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:3000", "http://localhost:5173"]'
      STORAGE_BACKEND: LOCAL
      GOV_INTEGRATION_API_KEY: ${GOV_INTEGRATION_API_KEY:-dev_gov_key}
      TRANSPORT_INTEGRATION_API_KEY: ${TRANSPORT_INTEGRATION_API_KEY:-dev_transport_key}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  # 3. React / Vite Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: link_x8_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
